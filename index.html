<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Đợi Anh Nhập Ngũ - 24 Tháng Yêu</title>
<style>
body{margin:0;padding:0;background:#1b4332;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;touch-action:none;user-select:none;overflow:hidden}
h1{font-size:16px;margin:6px 0 2px;color:#ffd166;text-transform:uppercase}
p{font-size:11px;margin:0 0 6px;color:#b7e4c7}
canvas{border:4px solid #ffd166;border-radius:12px;max-width:95vw;background:#8ecae6;display:block;touch-action:none}
.ft{font-size:11px;color:#95d5b2;margin-top:6px}
</style>
</head>
<body>
<h1>💘 Đợi Anh Nhập Ngũ - 24 Tháng Yêu</h1>
<p>Chạm kéo lùi để căng cung ngắm bắn - Thả tay để bắn!</p>
<canvas id="c" width="330" height="480"></canvas>
<div class="ft">Tác giả: <b>Niê Ngọc Hiếu</b> | Phố Đi Bộ Hồ Ea Kao</div>
<script>
var c=document.getElementById("c"),ctx=c.getContext("2d");
var mIdx=0,arrows=5,shots=[],start=0,over=0,win=0,wv=0,ang=-1.57,deadT=0,msg="",msgT=0,drag=0,sx=0,sy=0,pull=0,vxA=0,vyA=0,topM=0;
try{topM=parseInt(localStorage.getItem("ek_army")||"0");}catch(e){}
var rks=["Chớm Nở Tương Tư ❤️","Gửi Gió Trao Thương 🧡","Ánh Mắt Mong Chờ 💛","Nhịp Đập Chung Đôi 💚","Vấn Vương Kỷ Niệm 💙","Nửa Năm Hẹn Ước 💜","Sợi Chỉ Hồng Vương 💖","Trăng Non Đợi Bước 💗","Mùa Thu Thương Nhớ 💓","Vững Lòng Son Sắt 💞","Gió Đông Ấm Áp 💕","Tròn Năm Chung Thủy 💘","Bình Minh Hạnh Phúc 💝","Khúc Hát Giao Mùa 🌹","Nắng Hạ Chờ Mong 🌸","Biển Xanh Sóng Vỗ 🌺","Vượt Ngàn Thử Thách 💐","Mười Tám Trăng Tròn ✨","Ngôi Sao Dẫn Lối 🌟","Thiên Đường Tình Ái 💫","Cánh Chim Bồ Câu 🕊️","Bến Bờ Sum Họp 👑","Chạm Ngõ Ngày Về 💍","Vĩnh Kết Đồng Tâm 💎"];
var cls=[{x:30,y:45,s:.25},{x:175,y:75,s:.2},{x:285,y:40,s:.3}],dvs=[{x:80,y:65,s:.8},{x:220,y:95,s:.7},{x:310,y:55,s:.9}];
var ht={x:165,y:135,vx:1.8,r:24,t:0};
function rstH(lv){ht.y=95+Math.random()*95;ht.vx=(Math.random()>.5?1:-1)*(1.6+lv*.18);ht.r=Math.max(14,25-lv*.4);}
function init(){mIdx=0;arrows=5;shots=[];over=0;win=0;msg="";msgT=0;drag=0;pull=0;rstH(0);}
init();
function pos(e){var r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*(330/r.width),y:(p.clientY-r.top)*(480/r.height)};}
function down(e){if(e.cancelable)e.preventDefault();if(!start){start=1;return;}if(over||win){if(Date.now()-deadT<1500)return;init();return;}if(arrows<=0)return;var p=pos(e);drag=1;sx=p.x;sy=p.y;pull=0;}
function move(e){if(!drag)return;if(e.cancelable)e.preventDefault();var p=pos(e),dx=sx-p.x,dy=sy-p.y,d=Math.hypot(dx,dy);if(d>15){pull=Math.min(d,95);var a=Math.atan2(dy,dx);if(a>-.18)a=-.18;if(a<-2.96)a=-2.96;ang=a;var s=5.5+(pull/95)*7.5;vxA=Math.cos(a)*s;vyA=Math.sin(a)*s;}else pull=0;}
function up(){if(!drag)return;drag=0;if(pull>=18&&arrows>0){arrows--;shots.push({x:165,y:405,vx:vxA,vy:vyA,a:ang});}pull=0;}
c.addEventListener("touchstart",down,{passive:false});c.addEventListener("touchmove",move,{passive:false});c.addEventListener("touchend",up);
c.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
function drawBow(gx,gy,lv){
ctx.save();ctx.translate(gx,gy-16);ctx.rotate(ang+1.57);
var pO=(pull/95)*14,tier=Math.floor(lv/6);
var cols=["#8d5524","#e0fbfc","#ffd166","#ff4d6d"];
var glows=["transparent","rgba(224,251,252,.6)","rgba(255,209,102,.7)","rgba(144,224,239,.9)"];
if(tier>=1){ctx.shadowColor=glows[Math.min(tier,3)];ctx.shadowBlur=8+tier*4;}
ctx.strokeStyle=cols[Math.min(tier,3)];ctx.lineWidth=3.5+tier*.6;
ctx.beginPath();ctx.arc(0,-10,20+tier*1.5,3.45,5.97);ctx.stroke();
if(tier>=2){ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-10,16+tier,3.6,5.82);ctx.stroke();}
if(tier>=3){ctx.fillStyle="#90e0ef";ctx.beginPath();ctx.arc(0,-32,4,0,6.28);ctx.fill();}
ctx.shadowBlur=0;ctx.strokeStyle="#fff";ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(-18-tier,-18);ctx.lineTo(0,-18+pO);ctx.lineTo(18+tier,-18);ctx.stroke();
if(arrows>0){
ctx.strokeStyle=tier>=2?"#ffd166":"#d62828";ctx.lineWidth=2.5;
ctx.beginPath();ctx.moveTo(0,-18+pO);ctx.lineTo(0,-42+pO);ctx.stroke();
ctx.fillStyle=tier>=3?"#90e0ef":"#ffd166";
ctx.beginPath();ctx.moveTo(0,-47+pO);ctx.lineTo(-4.5,-38+pO);ctx.lineTo(4.5,-38+pO);ctx.fill();
}
ctx.restore();
}
function loop(){
wv+=.5;
for(var k=0;k<3;k++){cls[k].x-=cls[k].s;if(cls[k].x<-50)cls[k].x=360;dvs[k].x+=dvs[k].s;if(dvs[k].x>350)dvs[k].x=-30;}
if(start&&!over&&!win){
ht.t+=.05+mIdx*.005;ht.x+=ht.vx;if(ht.x<35||ht.x>295)ht.vx=-ht.vx;
if(mIdx>=3)ht.y+=Math.sin(ht.t)*(1.2+mIdx*.14);if(ht.y<75)ht.y=75;if(ht.y>245)ht.y=245;
for(var i=shots.length-1;i>=0;i--){
var s=shots[i];s.vy+=.14;s.x+=s.vx;s.y+=s.vy;s.a=Math.atan2(s.vy,s.vx);
if(Math.hypot(s.x-ht.x,s.y-ht.y)<ht.r+12){
shots.splice(i,1);mIdx++;arrows+=2;if(mIdx>topM){topM=mIdx;try{localStorage.setItem("ek_army",topM);}catch(e){}}
if(mIdx>=24){win=1;deadT=Date.now();}else{msg="💘 QUA THÁNG "+mIdx+": TẶNG THÊM MŨI TÊN (+1)!";msgT=85;rstH(mIdx);}
continue;
}
if(s.x<-20||s.x>350||s.y<-20||s.y>490)shots.splice(i,1);
}
if(arrows===0&&shots.length===0&&!win){over=1;deadT=Date.now();}
}
var sky=ctx.createLinearGradient(0,0,0,430);sky.addColorStop(0,"#4ea8de");sky.addColorStop(1,"#caf0f8");ctx.fillStyle=sky;ctx.fillRect(0,0,330,430);
ctx.fillStyle="rgba(255,255,255,.9)";for(var k=0;k<3;k++){var cl=cls[k];ctx.beginPath();ctx.arc(cl.x,cl.y,15,0,6.28);ctx.arc(cl.x+15,cl.y-5,18,0,6.28);ctx.arc(cl.x+30,cl.y,14,0,6.28);ctx.fill();}
ctx.font="18px Arial";ctx.textAlign="center";for(var k=0;k<3;k++)ctx.fillText("🕊️",dvs[k].x,dvs[k].y+Math.sin(wv*.1+k)*4);
ctx.fillStyle="#74c69d";ctx.beginPath();ctx.moveTo(0,430);ctx.quadraticCurveTo(165,355,330,430);ctx.fill();
ctx.fillStyle="#d62828";ctx.fillRect(10,365,10,65);ctx.fillRect(110,365,10,65);
ctx.fillStyle="#9b2226";ctx.beginPath();ctx.moveTo(2,366);ctx.lineTo(65,346);ctx.lineTo(128,366);ctx.fill();
ctx.fillStyle="#ffd166";ctx.fillRect(5,365,120,16);ctx.fillStyle="#9b2226";ctx.font="bold 7px Arial";ctx.fillText("CỔNG CHÀO EA KAO",65,376);
ctx.fillStyle="#2d6a4f";ctx.fillRect(215,385,105,22);ctx.strokeStyle="#ffd166";ctx.strokeRect(215,385,105,22);ctx.fillStyle="#ffd166";ctx.font="bold 8px Arial";ctx.fillText("PHỐ ĐI BỘ EA KAO",267,399);
ctx.fillStyle="#e9c46a";ctx.fillRect(0,430,330,50);ctx.fillStyle="#d4a373";for(var x=10;x<330;x+=35)ctx.fillRect(x,445,18,4);
if(drag&&pull>=18){ctx.fillStyle="#ffd166";for(var t=3;t<=27;t+=3){var px=165+vxA*t,py=405+vyA*t+.07*t*t;if(py<65)break;ctx.beginPath();ctx.arc(px,py,3-t*.06,0,6.28);ctx.fill();}}
var rk=rks[Math.min(mIdx,23)],ic=rk.split(" ").pop();
ctx.font=(ht.r*1.8)+"px Arial";ctx.fillText(ic,ht.x,ht.y+ht.r*.6);
for(var i=0;i<shots.length;i++){var s=shots[i];ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle="#d62828";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();ctx.fillStyle="#ffd166";ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(8,-5);ctx.lineTo(8,5);ctx.fill();ctx.restore();}
var gx=165,gy=425;ctx.fillStyle="#2b2d42";ctx.beginPath();ctx.arc(gx,gy-22,11,0,6.28);ctx.fill();ctx.beginPath();ctx.moveTo(gx-11,gy-20);ctx.lineTo(gx-15,gy+5);ctx.lineTo(gx+15,gy+5);ctx.lineTo(gx+11,gy-20);ctx.fill();
ctx.fillStyle="#ffccd5";ctx.beginPath();ctx.arc(gx,gy-20,8,0,6.28);ctx.fill();ctx.fillStyle="#ff4d6d";ctx.beginPath();ctx.moveTo(gx-8,gy-10);ctx.lineTo(gx+8,gy-10);ctx.lineTo(gx+14,gy+18);ctx.lineTo(gx-14,gy+18);ctx.fill();
drawBow(gx,gy,mIdx);
ctx.fillStyle="rgba(27,67,50,.85)";ctx.fillRect(10,8,310,48);ctx.strokeStyle="#ffd166";ctx.strokeRect(10,8,310,48);
ctx.fillStyle="#ffd166";ctx.font="bold 13px Arial";ctx.fillText("Tháng "+(mIdx+1)+"/24: "+rk,165,27);
ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.fillText("🏹 Mũi tên: "+arrows+"  |  Kỷ lục: "+topM+"/24 tháng",165,46);
if(msgT>0){msgT--;ctx.fillStyle="#d62828";ctx.font="bold 13px Arial";ctx.fillText(msg,165,76);}
if(!start){ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(15,105,300,205);ctx.strokeStyle="#ffd166";ctx.lineWidth=2;ctx.strokeRect(15,105,300,205);ctx.fillStyle="#ffd166";ctx.font="bold 16px Arial";ctx.fillText("ĐỢI ANH NHẬP NGŨ - 24 THÁNG",165,138);ctx.fillStyle="#80ed99";ctx.font="bold 13px Arial";ctx.fillText("Tác giả: Niê Ngọc Hiếu",165,162);ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.fillText("Chạm giữ và kéo ngược xuống để căng cung!",165,192);ctx.fillText("Trúng tim được hoàn tên + tặng thêm 1 tên 🏹",165,214);ctx.fillText("Cây cung nâng cấp rực rỡ theo từng mốc tháng!",165,236);ctx.fillStyle="#ffd166";ctx.font="bold 14px Arial";ctx.fillText("👉 CHẠM MÀN HÌNH ĐỂ BẮT ĐẦU",165,278);}
if(over||win){var canR=(Date.now()-deadT>=1500);ctx.fillStyle="rgba(0,0,0,.86)";ctx.fillRect(20,115,290,235);ctx.strokeStyle="#ffd166";ctx.lineWidth=3;ctx.strokeRect(20,115,290,235);ctx.fillStyle=win?"#80ed99":"#ef476f";ctx.font="bold 18px Arial";ctx.fillText(win?"🎉 HOÀN THÀNH 24 THÁNG ĐỢI CHỜ!":"💔 HẾT MŨI TÊN RỒI!",165,152);ctx.fillStyle="#ffd166";ctx.font="bold 14px Arial";ctx.fillText(win?"Cấp bậc: Vĩnh Kết Đồng Tâm 💎":"Đã vượt qua: "+mIdx+"/24 tháng",165,182);ctx.fillStyle="#fff";ctx.font="13px Arial";ctx.fillText("Danh hiệu: "+rks[Math.min(mIdx,23)],165,208);ctx.fillText("Kỷ lục cá nhân: "+topM+"/24 tháng",165,232);ctx.fillStyle="#b7e4c7";ctx.font="11px Arial";ctx.fillText("Tác giả: Niê Ngọc Hiếu - Phố Đi Bộ Ea Kao",165,264);ctx.fillStyle=canR?"#ffd166":"#888";ctx.font="bold 14px Arial";ctx.fillText(canR?"👉 Chạm màn hình để chơi lại":"⏳ Đang lưu thành tích...",165,310);}
requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
